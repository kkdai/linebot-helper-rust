[package]
name = "linebot-helper"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.23.1"
bytes = "1.12.1"
calamine = "0.37.0"
chrono = "0.4.45"
dashmap = "6.2.1"
futures = "0.3.34"
gcp_auth = "0.12.7"
hex = "0.4.3"
hmac = "0.13.0"
htmd = "0.5.6"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
pdf-extract = "0.12.1"
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
quick-xml = "0.42.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "gzip", "query", "form", "http2", "charset"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-stackdriver = "0.10.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4"] }
zip = "9.2.1"

[dev-dependencies]
base64 = "0.23.1"
hmac = "0.13.0"
sha2 = "0.11.1"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"
